[tools]
go = "1.27.3"
golangci-lint = "2.15.0"

[tasks.lint]
description = "Format, autofix, and run golangci-lint"
run = [
  "golangci-lint fmt",
  "golangci-lint run --fix ./...",
  "golangci-lint run ./...",
]

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.coverage]
description = "Report Go test coverage"
run = "go test ./... -coverprofile=/tmp/tick-sync-coverage.out && go tool cover -func=/tmp/tick-sync-coverage.out"

[tasks.generate]
description = "Generate Go mocks"
run = "go generate ./..."

[tasks.service]
description = "Run polling sync service"
run = "go run ./cmd/app"
